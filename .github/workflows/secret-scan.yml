name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check tracked files for common secret patterns
        run: ./scripts/check-secrets.sh
