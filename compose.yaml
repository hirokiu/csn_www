services:
  web:
    build:
      context: .
    ports:
      - "${CSN_HTTP_PORT:-8080}:80"
    environment:
      CSN_BASE_DIR: /data/www/410_seismic_www
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: csn
      DB_USER: csn
      DB_PASSWORD: ${DB_PASSWORD:-csn-local-only}
      GOOGLE_MAPS_BROWSER_API_KEY: ${GOOGLE_MAPS_BROWSER_API_KEY:-}
    volumes:
      - .:/data/www/410_seismic_www
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: csn
      MARIADB_USER: csn
      MARIADB_PASSWORD: ${DB_PASSWORD:-csn-local-only}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-csn-root-local-only}
    volumes:
      - csn-db:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  csn-db:
